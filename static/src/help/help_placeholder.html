<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trợ giúp</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
    color: #333;
  }
  .wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    padding: 48px;
    max-width: 480px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: #4C6FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    color: #666;
    line-height: 1.5;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">?</div>
      <h1>Trợ giúp</h1>
      <p>Nội dung hướng dẫn (video kênh YouTube) và thông tin liên hệ hỗ trợ đang được cập nhật.<br/>Vui lòng quay lại sau.</p>
    </div>
  </div>
</body>
</html>
